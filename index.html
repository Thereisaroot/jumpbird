<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Jump Stupid Bird - P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Jump Jump Stupid Bird</h1>

    <div id="p2p-container">
        <div id="my-info-section">
            <div>Your ID: <strong id="my-peer-id">...</strong></div>
            <div class="nickname-section">
                <input type="text" id="nickname-input" placeholder="Enter nickname">
                <button id="save-nickname-button">Save</button>
            </div>
        </div>
        <div id="user-list-container">
            <h3>Other Players</h3>
            <ul id="user-list"></ul>
        </div>
        <div id="status-section">
            <p>Status: <span id="connection-status">Initializing...</span></p>
        </div>
        <div id="manual-connect-section">
            <input type="text" id="peer-id-input" placeholder="Enter opponent's ID">
            <button id="connect-button">Manual Connect</button>
        </div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="480" height="640"></canvas>
        <div id="ui-container">
            <div id="score-container">Time: <span id="score">0</span>s</div>
            <div id="opponent-score-container">Opponent: <span id="opponent-score">0</span>s</div>
            <div id="debug-container">
                <h3>Debug Options</h3>
                <button id="toggle-debug">Toggle Hitbox</button>
            </div>
        </div>
        <div id="game-over-container">
            <h2 id="game-over-title">Game Over</h2>
            <div id="single-player-results">
                <p>Your Time: <span id="final-score">0</span>s</p>
                <h3>Best Records (Top 5)</h3>
                <ol id="high-scores"></ol>
            </div>
            <div id="multiplayer-results">
                <p>My Record: <span id="my-final-score">0</span></p>
                <p>Opponent: <span id="opponent-final-score">...</span></p>
            </div>
            <button id="new-game-button">New Game</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
