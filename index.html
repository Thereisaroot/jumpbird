<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Jump Stupid Bird - P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="bird.png" type="image/png">
</head>
<body>
    <!-- <h1>Jump Jump Stupid Bird</h1> -->
     <br>

    <div id="game-container">
        <canvas id="game-canvas" width="480" height="640"></canvas>
        
        <div id="lobby-ui" style="display: none;">
            <div id="my-id-container">
                <p>Your ID: <span id="my-id-display"></span></p>
                <input type="text" id="nickname-input" placeholder="Enter new nickname">
                <button id="save-nickname-button">Save</button>
            </div>
        </div>

        <div id="game-over-overlay" style="display: none;">
            <div id="game-over-card">
                <h2 id="game-over-title">Game Over</h2>
                <p id="my-final-score-text"></p>
                <p id="opponent-final-score-text"></p>
                <div id="game-over-buttons">
                    <button id="new-game-button">New Game</button>
                    <button id="back-to-menu-button">Back to Menu</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
